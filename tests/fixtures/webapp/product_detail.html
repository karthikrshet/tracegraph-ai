<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Detail - Local Commerce</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
    .form-group { margin-bottom: 1rem; }
    select, button { padding: 0.5rem 1rem; font-size: 1rem; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <a href="products.html">← Back to Products</a>
    <h1>Organic Apple Juice</h1>
  </header>
  <main>
    <div class="form-group">
      <label for="variantSelect">Select Flavor Attribute:</label>
      <select id="variantSelect" data-testid="attribute-dropdown">
        <option value="sweet">Sweet Apple</option>
        <option value="crisp">Crisp Green</option>
        <option value="cider">Spiced Cider</option>
      </select>
    </div>
    <div class="form-group">
      <label for="swatchSelect">Bottle Size Swatch:</label>
      <select id="swatchSelect" data-testid="swatch-attribute">
        <option value="small">250ml Small</option>
        <option value="medium">500ml Medium</option>
        <option value="large">1L Large</option>
      </select>
    </div>
    <div class="form-group">
      <button id="addToCartBtn" data-testid="add-to-cart-button" onclick="location.href='cart.html'">Add to Shopping Cart</button>
    </div>
  </main>
</body>
</html>
