<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout & Payment - Local Commerce</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; background: #f8fafc; color: #0f172a; }
    .form-group { margin-bottom: 1rem; }
    input, select, button { padding: 0.5rem; font-size: 1rem; }
    button { background: #2563eb; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <a href="cart.html">← Back to Cart</a>
    <h1>Checkout</h1>
  </header>
  <form id="checkoutForm" data-testid="checkout-form" onsubmit="event.preventDefault(); alert('Order placed!');">
    <div class="form-group">
      <label>Shipping Address:</label><br>
      <input type="text" name="address" data-testid="input-address" placeholder="123 Commerce St" required>
    </div>
    <div class="form-group">
      <label>Payment Method:</label><br>
      <select name="payment" data-testid="payment-method-select">
        <option value="card">Credit / Debit Card</option>
        <option value="paypal">PayPal</option>
      </select>
    </div>
    <button type="submit" data-testid="submit-order-button">Complete Order</button>
  </form>
</body>
</html>
