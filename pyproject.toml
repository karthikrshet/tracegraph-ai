[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph-ai"
version = "0.1.0"
description = "Evidence-grounded PR blast-radius analysis via 3-layer knowledge graph"
requires-python = ">=3.10"
dependencies = [
    # Web / API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    # Data models
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Graph DB
    "neo4j>=5.20.0",
    # Crawler
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # LLM
    "openai>=1.30.0",
    "tiktoken>=0.7.0",
    # Embeddings / vector search
    "numpy>=1.26.0",
    # AST parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    # GitHub
    "PyGithub>=2.3.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",  # for TestClient
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F401", "BLE001", "ASYNC230", "UP031"]
